<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <%- header %>
</head>

<body id="app" v-cloak>
  <Navbar></Navbar>
  <div id="content" class="container">
    <div class="page-header my-4">
      <h1>{{ $t('index.welcome') }}</h1>
      <Version-Badge @version-info="installedVersionNotStable = $event.installedVersionNotStable"></Version-Badge>
    </div>
    <p>{{ $t('index.description') }}</p>

    <!-- Fatal Errors Alert -->
    <div class="alert alert-danger my-4" v-if="fancyLogs.find(x => x.level === 'Fatal')">
      <div>
        <div class="d-flex align-items-center mb-3">
          <alert-circle :size="32" class="icon-lg me-3"></alert-circle>
          <div v-html="$t('index.startup_errors')"></div>
        </div>
        <ul class="mb-3">
          <li v-for="v in fancyLogs.filter(x => x.level === 'Fatal')">{{v.value}}</li>
        </ul>
        <a class="btn btn-danger" href="./troubleshooting#logs">
          <file-text :size="18" class="icon"></file-text>
          View Logs
        </a>
      </div>
    </div>

    <!-- Notices from plugins' status scripts -->
    <div class="alert my-4"
         :class="notice.level === 'warning' ? 'alert-warning' : 'alert-info'"
         v-for="(notice, index) in pluginNotices"
         :key="`${notice.plugin}-${index}`">
      <div class="d-flex align-items-center" :class="{ 'mb-3': notice.href }">
        <alert-triangle v-if="notice.level === 'warning'" :size="32" class="icon-lg me-3 flex-shrink-0"></alert-triangle>
        <info v-else :size="32" class="icon-lg me-3 flex-shrink-0"></info>
        <div>
          <p class="mb-1"><strong>{{ notice.title }}</strong></p>
          <p class="mb-1" v-if="notice.text">{{ notice.text }}</p>
          <p class="mb-0 small text-body-secondary">{{ $t('index.plugin_notice_from', { name: notice.plugin_name }) }}</p>
        </div>
      </div>
      <a v-if="notice.href"
         class="btn"
         :class="notice.level === 'warning' ? 'btn-warning' : 'btn-info'"
         :href="notice.href"
         :target="notice.href.startsWith('https://') ? '_blank' : null"
         :rel="notice.href.startsWith('https://') ? 'noopener noreferrer' : null">
        {{ notice.action || $t('index.plugin_notice_open') }}
      </a>
    </div>

    <!-- Recommendations -->
    <Recommendations :config="config" :suggest-xgpad="suggestXgpad" @xgpad-installed="loadVirtualInputStatus" @virtualhid-enabled="loadPluginNotices" @restarted="loadAfterRestart"></Recommendations>

    <!-- Resources -->
    <div class="my-4">
      <Resource-Card :installed-version-not-stable="installedVersionNotStable"></Resource-Card>
    </div>
  </div>
</body>

<script type="module">
  import { createApp } from 'vue'
  import { initApp } from './init'
  import Navbar from './Navbar.vue'
  import ResourceCard from './ResourceCard.vue'
  import Recommendations from './Recommendations.vue'
  import VersionBadge from './VersionBadge.vue'
  import {
    AlertCircle,
    AlertTriangle,
    FileText,
    Info,
  } from '@lucide/vue'

  console.log("Hello, Sunshine!")
  let app = createApp({
    components: {
      Navbar,
      ResourceCard,
      Recommendations,
      VersionBadge,
      AlertCircle,
      AlertTriangle,
      FileText,
      Info,
    },
    data() {
      return {
        config: null,
        installedVersionNotStable: false,
        pluginNotices: [],
        logs: null,
        platform: "",
        controllerEnabled: false,
        gamepadDriver: '',
        xgpad: null,  // The xgpad plugin, which installs the xgpad driver, or null when this build has none
      }
    },
    async created() {
      // Status scripts can take a few seconds, so the notices load on their own
      this.loadPluginNotices();
      await this.loadConfig();
      try {
        this.logs = (await fetch("./api/logs").then(r => r.text()))
      } catch (e) {
        console.error(e);
      }
    },
    computed: {
      /**
       * Whether to recommend the xgpad plugin, which installs the xgpad driver: gamepads are on, no virtual gamepad
       * driver is installed, and the selected gamepad driver setting would use xgpad.
       */
      suggestXgpad() {
        return this.xgpadMightBeUsed && !!this.xgpad && !this.xgpad.installed && this.config.virtualhid_driver_installed === false &&
          this.config.vigembus_installed === false;
      },
      /**
       * Whether the gamepad driver setting would use xgpad for controllers.
       */
      xgpadMightBeUsed() {
        return this.platform === 'windows' && this.controllerEnabled && ['', 'all', 'xgpad'].includes(this.gamepadDriver);
      },
      /** Parse the text errors, calculating the text, the timestamp and the level */
      fancyLogs() {
        if (!this.logs) return [];
        let regex = /(\[\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}]):\s/g;
        let rawLogLines = (this.logs.split(regex)).splice(1);
        let logLines = []
        for (let i = 0; i < rawLogLines.length; i += 2) {
          logLines.push({ timestamp: rawLogLines[i], level: rawLogLines[i + 1].split(":")[0], value: rawLogLines[i + 1] });
        }
        return logLines;
      }
    },
    methods: {
      /**
       * Load the settings, and on Windows the virtual input drivers they may use.
       */
      async loadConfig() {
        try {
          let config = await fetch("./api/config").then((r) => r.json());
          this.config = config;
          this.platform = config.platform;
          this.controllerEnabled = config.controller !== "disabled";
          this.gamepadDriver = config.gamepad_driver || '';

          if (this.platform === 'windows') {
            await this.loadVirtualInputStatus();
          }
        } catch (e) {
          console.error(e);
        }
      },
      /**
       * Load what a restart Sunshine came back from can change, without reloading the page.
       */
      async loadAfterRestart() {
        await this.loadConfig();
        this.loadPluginNotices();
      },
      /**
       * Load the notices plugins report through their status scripts.
       */
      async loadPluginNotices() {
        try {
          const body = await fetch("./api/plugins/notices").then((r) => r.json());
          this.pluginNotices = body.notices || [];
        } catch (e) {
          console.error("Failed to fetch plugin notices:", e);
        }
      },
      /**
       * Load the xgpad plugin, which says whether it installed its driver.
       */
      async loadVirtualInputStatus() {
        let plugins = [];
        try {
          plugins = (await fetch("./api/plugins").then((r) => r.json())).plugins || [];
        } catch (e) {
          console.error("Failed to fetch plugins:", e);
          return;
        }
        this.xgpad = plugins.find((plugin) => plugin.id === 'xgpad') || null;
      },
    }
  });

  initApp(app);
</script>
</html>
