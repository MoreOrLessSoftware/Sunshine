<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stadia Controller</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #212529;
      --muted: #6c757d;
      --line: #dee2e6;
      --body: #f1f3f5;
      --button: #ffffff;
      --on: #fd5e20;
      --on-fg: #ffffff;
      --ok: #198754;
      --warn: #b8860b;
      --bad: #dc3545;
    }
    :root[data-theme="dark"] {
      --bg: #212529;
      --fg: #dee2e6;
      --muted: #adb5bd;
      --line: #495057;
      --body: #2b3035;
      --button: #343a40;
      --on: #ff7a45;
      --on-fg: #ffffff;
      --ok: #75b798;
      --warn: #ffda6a;
      --bad: #ea868f;
    }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 4px 2px; }
    .status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    .detail { color: var(--muted); }
    .tabs { display: flex; gap: 6px; margin: 4px 0; }
    .tabs button {
      border: 1px solid var(--line); background: var(--button); color: var(--fg);
      border-radius: 4px; padding: 2px 10px; cursor: pointer; font: inherit;
    }
    .tabs button.current { border-color: var(--on); color: var(--on); }
    svg { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 auto; }
    svg .shell { fill: var(--body); stroke: var(--line); stroke-width: 2; }
    svg .key { fill: var(--button); stroke: var(--line); stroke-width: 1.5; transition: fill 60ms; }
    svg .key.on { fill: var(--on); stroke: var(--on); }
    svg text { fill: var(--muted); font-size: 12px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    svg .key.on + text { fill: var(--on-fg); }
    svg .well { fill: none; stroke: var(--line); stroke-width: 1.5; }
    svg .trigger-fill { fill: var(--on); }
    svg.idle { opacity: 0.45; }
    .values { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; color: var(--muted);
              font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="status"><span class="dot" id="dot"></span><strong id="headline">Connecting to Sunshine...</strong><span class="detail" id="detail"></span></div>
  <div class="tabs" id="tabs" hidden></div>

  <svg id="pad" class="idle" viewBox="0 0 600 330" role="img" aria-label="Stadia Controller inputs">
    <!-- triggers (L2 / R2) fill with the analog value -->
    <rect class="key" x="110" y="8" width="110" height="16" rx="6"></rect>
    <rect class="trigger-fill" id="l2-fill" x="110" y="8" width="0" height="16" rx="6"></rect>
    <text x="165" y="16" id="l2-text">L2</text>
    <rect class="key" x="380" y="8" width="110" height="16" rx="6"></rect>
    <rect class="trigger-fill" id="r2-fill" x="380" y="8" width="0" height="16" rx="6"></rect>
    <text x="435" y="16" id="r2-text">R2</text>

    <!-- shoulders -->
    <rect class="key" data-button="l1" x="110" y="32" width="110" height="18" rx="7"></rect><text x="165" y="41">L1</text>
    <rect class="key" data-button="r1" x="380" y="32" width="110" height="18" rx="7"></rect><text x="435" y="41">R1</text>

    <path class="shell" d="M150,62 C210,48 390,48 450,62 C520,77 560,132 575,212 C590,292 545,322 505,312 C470,304 450,262 420,242 L180,242 C150,262 130,304 95,312 C55,322 10,292 25,212 C40,132 80,77 150,62 Z"></path>

    <!-- d-pad -->
    <rect class="key" data-button="dpad_up" x="138" y="104" width="24" height="30" rx="4"></rect><text x="150" y="119">▲</text>
    <rect class="key" data-button="dpad_down" x="138" y="158" width="24" height="30" rx="4"></rect><text x="150" y="173">▼</text>
    <rect class="key" data-button="dpad_left" x="108" y="134" width="30" height="24" rx="4"></rect><text x="123" y="146">◀</text>
    <rect class="key" data-button="dpad_right" x="162" y="134" width="30" height="24" rx="4"></rect><text x="177" y="146">▶</text>

    <!-- face buttons -->
    <circle class="key" data-button="y" cx="450" cy="112" r="15"></circle><text x="450" y="112">Y</text>
    <circle class="key" data-button="a" cx="450" cy="180" r="15"></circle><text x="450" y="180">A</text>
    <circle class="key" data-button="x" cx="416" cy="146" r="15"></circle><text x="416" y="146">X</text>
    <circle class="key" data-button="b" cx="484" cy="146" r="15"></circle><text x="484" y="146">B</text>

    <!-- center cluster -->
    <circle class="key" data-button="options" cx="252" cy="104" r="11"></circle><text x="252" y="104">⋯</text>
    <circle class="key" data-button="menu" cx="348" cy="104" r="11"></circle><text x="348" y="104">≡</text>
    <circle class="key" data-button="stadia" cx="300" cy="132" r="17"></circle><text x="300" y="132">S</text>
    <circle class="key" data-button="assistant" cx="276" cy="174" r="10"></circle><text x="276" y="174">✦</text>
    <circle class="key" data-button="capture" cx="324" cy="174" r="10"></circle><text x="324" y="174">◉</text>

    <!-- sticks: the knob moves with the axes and lights up when clicked (L3 / R3) -->
    <circle class="well" cx="225" cy="208" r="30"></circle>
    <circle class="key" data-button="l3" id="left-knob" cx="225" cy="208" r="18"></circle><text id="left-label" x="225" y="208">L3</text>
    <circle class="well" cx="375" cy="208" r="30"></circle>
    <circle class="key" data-button="r3" id="right-knob" cx="375" cy="208" r="18"></circle><text id="right-label" x="375" y="208">R3</text>
  </svg>
  <div class="values" id="values"></div>

  <script>
    'use strict';
    const id = new URLSearchParams(location.search).get('id') || 'stadia-controller';
    const proxy = (path) => `./proxy?id=${encodeURIComponent(id)}&path=${encodeURIComponent(path)}`;
    const $ = (name) => document.getElementById(name);
    const keys = [...document.querySelectorAll('[data-button]')];
    const padNames = {xgpad: 'Xbox Series controller', vigem: 'Xbox 360 controller'};
    let selected = null;

    // Follow Sunshine's light / dark theme (the page that frames this one).
    function applyTheme() {
      let theme = 'light';
      try {
        theme = window.parent.document.documentElement.getAttribute('data-bs-theme') || 'auto';
      } catch (e) {
        theme = 'auto';
      }
      if (theme === 'auto') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    }
    applyTheme();
    try {
      new MutationObserver(applyTheme).observe(window.parent.document.documentElement, {attributes: true, attributeFilter: ['data-bs-theme']});
    } catch (e) { /* not framed by Sunshine */ }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

    function setStatus(level, headline, detail) {
      $('dot').className = 'dot ' + level;
      $('headline').textContent = headline;
      $('detail').textContent = detail || '';
    }

    function moveKnob(knob, label, cx, cy, x, y) {
      const dx = (x / 32768) * 14;
      const dy = (-y / 32768) * 14;  // the controller reports Y positive = up
      knob.setAttribute('cx', cx + dx);
      knob.setAttribute('cy', cy + dy);
      label.setAttribute('x', cx + dx);
      label.setAttribute('y', cy + dy);
    }

    function showInput(input) {
      const held = new Set(input ? input.held : []);
      for (const key of keys) {
        key.classList.toggle('on', held.has(key.dataset.button));
      }
      const v = input || {lx: 0, ly: 0, rx: 0, ry: 0, l2: 0, r2: 0};
      $('l2-fill').setAttribute('width', (v.l2 / 255) * 110);
      $('r2-fill').setAttribute('width', (v.r2 / 255) * 110);
      moveKnob($('left-knob'), $('left-label'), 225, 208, v.lx, v.ly);
      moveKnob($('right-knob'), $('right-label'), 375, 208, v.rx, v.ry);
      $('values').textContent = input ?
        `LX ${v.lx}  LY ${v.ly}  RX ${v.rx}  RY ${v.ry}  L2 ${v.l2}  R2 ${v.r2}` + (held.size ? `  [${[...held].join(' ')}]` : '') :
        '';
    }

    function showTabs(labels) {
      const tabs = $('tabs');
      tabs.hidden = labels.length < 2;
      if (tabs.hidden) {
        return;
      }
      if (tabs.dataset.labels !== labels.join(',')) {
        tabs.dataset.labels = labels.join(',');
        tabs.replaceChildren(...labels.map((label) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = `Controller ${label}`;
          button.onclick = () => { selected = label; };
          return button;
        }));
      }
      for (const button of tabs.children) {
        button.classList.toggle('current', button.textContent === `Controller ${selected}`);
      }
    }

    function describe(label, c, doc) {
      const online = (c.display_state === 'ready' || c.display_state === 'input') && c.heard_s < 10;
      const parts = [];
      if (c.battery_percent !== null && c.battery_percent !== undefined) {
        parts.push(`battery ${c.battery_percent}%`);
      }
      if (c.headset) {
        parts.push('headset plugged in');
      }
      let level = online ? 'ok' : 'warn';
      if (doc.gamepad === 'off') {
        parts.push('no virtual controller');
      } else if (c.gamepad && c.gamepad.error) {
        level = 'bad';
        parts.push(`virtual controller failed: ${c.gamepad.error}`);
      } else if (c.gamepad) {
        parts.push(`${padNames[doc.gamepad] || doc.gamepad}, player ${c.gamepad.slot === null ? '?' : c.gamepad.slot + 1}`);
      } else {
        parts.push(`the ${padNames[doc.gamepad] || 'virtual controller'} appears with the first input`);
      }
      const headline = online ? `Controller ${label} connected` : `Controller ${label} is not responding (last heard ${c.heard_s} s ago)`;
      setStatus(level, headline, parts.join(' · '));
    }

    async function poll() {
      let delay = 100;
      try {
        const response = await fetch(proxy('/_input'), {cache: 'no-store'});
        if (response.status === 502) {
          setStatus('', 'The receiver is not running.', 'Use Start test above, or start a stream.');
          $('pad').classList.add('idle');
          showTabs([]);
          showInput(null);
          delay = 2000;
        } else if (!response.ok) {
          setStatus('bad', `Sunshine answered HTTP ${response.status}.`, '');
          delay = 2000;
        } else {
          const doc = await response.json();
          const labels = Object.keys(doc.controllers || {});
          if (!labels.includes(selected)) {
            selected = labels[0] || null;
          }
          showTabs(labels);
          if (!selected) {
            setStatus('warn', 'Waiting for the controller.', 'Wake it with a short press of the Stadia button.');
            $('pad').classList.add('idle');
            showInput(null);
            delay = 500;
          } else {
            const c = doc.controllers[selected];
            describe(selected, c, doc);
            $('pad').classList.toggle('idle', !c.input);
            showInput(c.input);
          }
        }
      } catch (e) {
        setStatus('bad', 'Sunshine did not answer.', String(e));
        delay = 2000;
      }
      window.setTimeout(poll, document.hidden ? Math.max(delay, 1000) : delay);
    }
    poll();
  </script>
</body>
</html>
