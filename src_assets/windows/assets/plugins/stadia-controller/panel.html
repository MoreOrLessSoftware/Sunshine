<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stadia Controller</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #212529;
      --muted: #6c757d;
      --line: #dee2e6;
      --outline: #868e96;
      --dim: #ced4da;
      --glyph: #495057;
      --shell: rgba(0, 0, 0, 0.03);
      --on: #fd5e20;
      --on-fg: #ffffff;
      --ok: #198754;
      --warn: #b8860b;
      --bad: #dc3545;
    }
    :root[data-theme="dark"] {
      --bg: #212529;
      --fg: #dee2e6;
      --muted: #adb5bd;
      --line: #495057;
      --outline: #8e918f;
      --dim: #444746;
      --glyph: #c4c7c5;
      --shell: rgba(255, 255, 255, 0.05);
      --on: #ff7a45;
      --on-fg: #1b1b1b;
      --ok: #75b798;
      --warn: #ffda6a;
      --bad: #ea868f;
    }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 4px 2px; }
    .status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    .detail { color: var(--muted); }
    .tabs { display: flex; gap: 6px; margin: 4px 0; }
    .tabs button {
      border: 1px solid var(--line); background: var(--bg); color: var(--fg);
      border-radius: 4px; padding: 2px 10px; cursor: pointer; font: inherit;
    }
    .tabs button.current { border-color: var(--on); color: var(--on); }
    svg { width: 100%; max-width: 620px; height: auto; display: block; margin: 0 auto; }
    svg.idle { opacity: 0.45; }

    /* Controller artwork: colors come from the theme instead of the original fixed values. */
    svg .shell { fill: var(--shell); stroke: var(--outline); }
    svg .outline { stroke: var(--outline); fill: none; transition: fill 60ms, stroke 60ms; }
    svg .dim { stroke: var(--dim); fill: none; }
    svg .glyph { fill: var(--glyph); transition: fill 60ms; }
    svg .bumper { stroke: var(--dim); fill: none; transition: stroke 60ms; }
    svg .area { fill: transparent; transition: fill 60ms; }
    svg .trigger { fill: none; stroke: var(--outline); }
    svg .trigger-fill { fill: var(--on); }
    svg .label { fill: var(--muted); font: 600 22px system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
    svg .on .outline, svg .outline.on { fill: var(--on); stroke: var(--on); }
    svg .on .glyph { fill: var(--on-fg); }
    svg .bumper.on { stroke: var(--on); }
    svg .area.on { fill: var(--on); }

    .values { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; color: var(--muted);
              font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; min-height: 1.4em; }
  </style>
</head>
<body>

  <div class="values" id="values"></div>

  <script>
    'use strict';
    const id = new URLSearchParams(location.search).get('id') || 'stadia-controller';
    const proxy = (path, stream) => `./proxy?id=${encodeURIComponent(id)}&path=${encodeURIComponent(path)}${stream ? '&stream=1' : ''}`;
    const $ = (name) => document.getElementById(name);
    const buttons = [...document.querySelectorAll('#pad [data-button]')];
    const padNames = {xgpad: 'Xbox Series controller', vigem: 'Xbox 360 controller'};
    const STICK_TRAVEL = 16;  // how far a cap moves inside its well, in drawing units
    const TRIGGER_WIDTH = 160;
    let selected = null;
    let source = null;
    let lastEvent = 0;
    let retryTimer = null;

    // Follow Sunshine's light / dark theme (the page that frames this one).
    function applyTheme() {
      let theme = 'auto';
      try {
        theme = window.parent.document.documentElement.getAttribute('data-bs-theme') || 'auto';
      } catch (e) {
        theme = 'auto';
      }
      if (theme === 'auto') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    }
    applyTheme();
    try {
      new MutationObserver(applyTheme).observe(window.parent.document.documentElement, {attributes: true, attributeFilter: ['data-bs-theme']});
    } catch (e) { /* not framed by Sunshine */ }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

    function setStatus(level, headline, detail) {
      $('dot').className = 'dot ' + level;
      $('headline').textContent = headline;
      $('detail').textContent = detail || '';
    }

    function showInput(input) {
      const held = new Set(input ? input.held : []);
      for (const button of buttons) {
        button.classList.toggle('on', held.has(button.dataset.button));
      }
      const v = input || {lx: 0, ly: 0, rx: 0, ry: 0, l2: 0, r2: 0};
      $('l2-fill').setAttribute('width', (v.l2 / 255) * TRIGGER_WIDTH);
      $('r2-fill').setAttribute('width', (v.r2 / 255) * TRIGGER_WIDTH);
      // The controller reports Y positive = up; SVG y grows downwards.
      $('left-stick').setAttribute('transform', `translate(${(v.lx / 32768) * STICK_TRAVEL} ${(-v.ly / 32768) * STICK_TRAVEL})`);
      $('right-stick').setAttribute('transform', `translate(${(v.rx / 32768) * STICK_TRAVEL} ${(-v.ry / 32768) * STICK_TRAVEL})`);
      $('values').textContent = input ?
        `LX ${v.lx}  LY ${v.ly}  RX ${v.rx}  RY ${v.ry}  L2 ${v.l2}  R2 ${v.r2}` + (held.size ? `  [${[...held].join(' ')}]` : '') :
        '';
    }

    function showTabs(labels) {
      const tabs = $('tabs');
      tabs.hidden = labels.length < 2;
      if (tabs.hidden) {
        return;
      }
      if (tabs.dataset.labels !== labels.join(',')) {
        tabs.dataset.labels = labels.join(',');
        tabs.replaceChildren(...labels.map((label) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.label = label;
          button.textContent = `Controller ${label}`;
          button.onclick = () => { selected = label; render(); };
          return button;
        }));
      }
      for (const button of tabs.children) {
        button.classList.toggle('current', button.dataset.label === selected);
      }
    }

    function describe(label, c, doc) {
      const online = (c.display_state === 'ready' || c.display_state === 'input') && c.heard_s < 10;
      const parts = [];
      if (c.ip) {
        parts.push(`IP ${c.ip}`);
      }
      if (c.battery_percent !== null && c.battery_percent !== undefined) {
        parts.push(`battery ${c.battery_percent}%`);
      }
      if (c.headset) {
        parts.push('headset plugged in');
      }
      let level = online ? 'ok' : 'warn';
      if (doc.gamepad === 'off') {
        parts.push('no virtual controller');
      } else if (c.gamepad && c.gamepad.error) {
        level = 'bad';
        parts.push(`virtual controller failed: ${c.gamepad.error}`);
      } else if (c.gamepad) {
        parts.push(`${padNames[doc.gamepad] || doc.gamepad}, player ${c.gamepad.slot === null ? '?' : c.gamepad.slot + 1}`);
      } else {
        parts.push(`the ${padNames[doc.gamepad] || 'virtual controller'} appears with the first input`);
      }
      const headline = online ? `Controller ${label} connected` : `Controller ${label} is not responding (last heard ${c.heard_s} s ago)`;
      setStatus(level, headline, parts.join(' · '));
    }

    let latest = null;
    function render() {
      const doc = latest;
      const labels = Object.keys((doc && doc.controllers) || {});
      if (!labels.includes(selected)) {
        selected = labels[0] || null;
      }
      showTabs(labels);
      if (!selected) {
        setStatus('warn', 'Waiting for the controller.', 'Wake it with a short press of the Stadia button.');
        $('pad').classList.add('idle');
        showInput(null);
        return;
      }
      const c = doc.controllers[selected];
      describe(selected, c, doc);
      $('pad').classList.toggle('idle', !c.input);
      showInput(c.input);
    }

    // The receiver pushes its /_input document as server-sent events through Sunshine.
    function connect() {
      window.clearTimeout(retryTimer);
      if (source) {
        source.close();
      }
      source = new EventSource(proxy('/_events', true));
      source.addEventListener('input', (event) => {
        lastEvent = Date.now();
        latest = JSON.parse(event.data);
        render();
      });
      source.onerror = () => {
        if (source.readyState === EventSource.CLOSED) {
          explainFailure();  // not a stream at all, e.g. the receiver is not running
        }
        // otherwise the browser reconnects on its own (the stream ends every few minutes by design)
      };
    }

    async function explainFailure() {
      source = null;
      latest = null;
      showTabs([]);
      showInput(null);
      $('pad').classList.add('idle');
      try {
        const response = await fetch(proxy('/_input', false), {cache: 'no-store'});
        if (response.status === 502) {
          setStatus('', 'The receiver is not running.', 'Use Start test above, or start a stream.');
        } else {
          setStatus('bad', `Sunshine answered HTTP ${response.status}.`, '');
        }
      } catch (e) {
        setStatus('bad', 'Sunshine did not answer.', String(e));
      }
      retryTimer = window.setTimeout(connect, 2000);
    }

    // The receiver sends at least one event every 2 seconds; silence means the stream is stuck.
    window.setInterval(() => {
      if (source && source.readyState === EventSource.OPEN && Date.now() - lastEvent > 6000) {
        connect();
      }
    }, 1000);

    connect();
  </script>
</body>
</html>
